name: Build

on:
  workflow_dispatch:
    inputs:
      mod_name_full:
        description: 'Complete mod name (optional, if set, will override mod_name-mod_version)'
        required: false
        type: string
      mod_name:
        description: 'Mod name (used if mod_name_full is not set)'
        required: false
        type: string
      mod_version:
        description: 'Mod version (used if mod_name_full is not set)'
        required: false
        type: string
      is_suffix_required:
        description: 'Add build suffix (-buildGITHUB_RUN_NUMBER)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compose CI mod version
        shell: pwsh
        run: |
          # Get inputs from workflow_dispatch if available
          $mod_name_full = '${{ inputs.mod_name_full }}'
          $mod_name = '${{ inputs.mod_name }}'
          $mod_version = '${{ inputs.mod_version }}'
          $is_suffix_required = '${{ inputs.is_suffix_required }}' -eq 'true'
          
          # Determine the final mod version
          if ($mod_name_full) {
            # If mod_name_full is provided, use it directly
            $finalModVersion = $mod_name_full
          } else {
            # Otherwise, read default values from gradle.properties
            $baseModname = (Get-Content gradle.properties | Where-Object { $_ -match '^archives_name=' }) -replace '^archives_name=', ''
            $baseVersion = (Get-Content gradle.properties | Where-Object { $_ -match '^mod_version=' }) -replace '^mod_version=', ''
            
            # Override with inputs if provided (either or both can be provided)
            if ($mod_name) { $baseModname = $mod_name }
            if ($mod_version) { $baseVersion = $mod_version }
            
            # Validate that we have both required values
            if (-not $baseModname -or -not $baseVersion) { 
              throw "Could not determine mod_name and mod_version from inputs or gradle.properties" 
            }
            
            # Compose as mod_name-mod_version
            $finalModVersion = "$baseModname-$baseVersion"
          }
          
          # Add build suffix if required (applies to both mod_name_full and mod_name-mod_version cases)
          if ($is_suffix_required) {
            $finalModVersion = "$finalModVersion-build$env:GITHUB_RUN_NUMBER"
          }
          
          "ORG_GRADLE_PROJECT_mod_version=$finalModVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build with Gradle
        shell: pwsh
        run: .\gradlew.bat clean build --stacktrace --no-daemon

      - name: Locate common jar
        shell: pwsh
        id: common_jar
        run: |
          if (Test-Path 'common/build/libs') {
            $jar = Get-ChildItem -Path 'common/build/libs' -File -Filter '*.jar' |
              Where-Object {
                $_.Name -notlike '*-sources.jar' -and
                $_.Name -notlike '*-javadoc.jar' -and
                $_.Name -notlike '*-dev.jar' -and
                $_.Name -notlike '*-dev-shadow.jar' -and
                $_.Name -notlike '*transformProduction*.jar'
              } |
              Sort-Object Name |
              Select-Object -First 1

            if ($jar) {
              "path=$($jar.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            }
          }

      - name: Upload common jar
        if: steps.common_jar.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: common-jar
          path: ${{ steps.common_jar.outputs.path }}
          if-no-files-found: error

      - name: Locate fabric jar
        shell: pwsh
        id: fabric_jar
        run: |
          if (Test-Path 'fabric/build/libs') {
            $jar = Get-ChildItem -Path 'fabric/build/libs' -File -Filter '*.jar' |
              Where-Object {
                $_.Name -notlike '*-sources.jar' -and
                $_.Name -notlike '*-javadoc.jar' -and
                $_.Name -notlike '*-dev.jar' -and
                $_.Name -notlike '*-dev-shadow.jar' -and
                $_.Name -notlike '*transformProduction*.jar'
              } |
              Sort-Object Name |
              Select-Object -First 1

            if ($jar) {
              "path=$($jar.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            }
          }

      - name: Upload fabric jar
        if: steps.fabric_jar.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: fabric-jar
          path: ${{ steps.fabric_jar.outputs.path }}
          if-no-files-found: error

      - name: Locate forge jar
        shell: pwsh
        id: forge_jar
        run: |
          if (Test-Path 'forge/build/libs') {
            $jar = Get-ChildItem -Path 'forge/build/libs' -File -Filter '*.jar' |
              Where-Object {
                $_.Name -notlike '*-sources.jar' -and
                $_.Name -notlike '*-javadoc.jar' -and
                $_.Name -notlike '*-dev.jar' -and
                $_.Name -notlike '*-dev-shadow.jar' -and
                $_.Name -notlike '*transformProduction*.jar'
              } |
              Sort-Object Name |
              Select-Object -First 1

            if ($jar) {
              "path=$($jar.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            }
          }

      - name: Upload forge jar
        if: steps.forge_jar.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: forge-jar
          path: ${{ steps.forge_jar.outputs.path }}
          if-no-files-found: error

      - name: Locate neoforge jar
        shell: pwsh
        id: neoforge_jar
        run: |
          if (Test-Path 'neoforge/build/libs') {
            $jar = Get-ChildItem -Path 'neoforge/build/libs' -File -Filter '*.jar' |
              Where-Object {
                $_.Name -notlike '*-sources.jar' -and
                $_.Name -notlike '*-javadoc.jar' -and
                $_.Name -notlike '*-dev.jar' -and
                $_.Name -notlike '*-dev-shadow.jar' -and
                $_.Name -notlike '*transformProduction*.jar'
              } |
              Sort-Object Name |
              Select-Object -First 1

            if ($jar) {
              "path=$($jar.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            }
          }

      - name: Upload neoforge jar
        if: steps.neoforge_jar.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-jar
          path: ${{ steps.neoforge_jar.outputs.path }}
          if-no-files-found: error
