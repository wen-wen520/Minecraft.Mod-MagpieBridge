name: Automatic Build on Push

on:
  push:
    branches:
      - '*'

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compose CI mod version
        shell: pwsh
        run: |
          $baseVersion = (Get-Content gradle.properties | Where-Object { $_ -match '^mod_version=' }) -replace '^mod_version=', ''
          if (-not $baseVersion) { throw "mod_version not found in gradle.properties" }
          "ORG_GRADLE_PROJECT_mod_version=$baseVersion-alpha$env:GITHUB_RUN_NUMBER" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build with Gradle
        shell: pwsh
        run: .\gradlew.bat clean build --stacktrace --no-daemon

      - name: Locate common jar
        shell: pwsh
        id: common_jar
        run: |
          if (Test-Path 'common/build/libs') {
            $jar = Get-ChildItem -Path 'common/build/libs' -File -Filter '*.jar' |
              Where-Object {
                $_.Name -notlike '*-sources.jar' -and
                $_.Name -notlike '*-javadoc.jar' -and
                $_.Name -notlike '*-dev.jar' -and
                $_.Name -notlike '*-dev-shadow.jar' -and
                $_.Name -notlike '*transformProduction*.jar'
              } |
              Sort-Object Name |
              Select-Object -First 1

            if ($jar) {
              "path=$($jar.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              "name=$($jar.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            }
          }

      - name: Upload common jar
        if: steps.common_jar.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.common_jar.outputs.name }}
          path: ${{ steps.common_jar.outputs.path }}
          if-no-files-found: error

      - name: Locate fabric jar
        shell: pwsh
        id: fabric_jar
        run: |
          if (Test-Path 'fabric/build/libs') {
            $jar = Get-ChildItem -Path 'fabric/build/libs' -File -Filter '*.jar' |
              Where-Object {
                $_.Name -notlike '*-sources.jar' -and
                $_.Name -notlike '*-javadoc.jar' -and
                $_.Name -notlike '*-dev.jar' -and
                $_.Name -notlike '*-dev-shadow.jar' -and
                $_.Name -notlike '*transformProduction*.jar'
              } |
              Sort-Object Name |
              Select-Object -First 1

            if ($jar) {
              "path=$($jar.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              "name=$($jar.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            }
          }

      - name: Upload fabric jar
        if: steps.fabric_jar.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.fabric_jar.outputs.name }}
          path: ${{ steps.fabric_jar.outputs.path }}
          if-no-files-found: error

      - name: Locate quilt jar
        shell: pwsh
        id: quilt_jar
        run: |
          if (Test-Path 'quilt/build/libs') {
            $jar = Get-ChildItem -Path 'quilt/build/libs' -File -Filter '*.jar' |
              Where-Object {
                $_.Name -notlike '*-sources.jar' -and
                $_.Name -notlike '*-javadoc.jar' -and
                $_.Name -notlike '*-dev.jar' -and
                $_.Name -notlike '*-dev-shadow.jar' -and
                $_.Name -notlike '*transformProduction*.jar'
              } |
              Sort-Object Name |
              Select-Object -First 1

            if ($jar) {
              "path=$($jar.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              "name=$($jar.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            }
          }

      - name: Upload quilt jar
        if: steps.quilt_jar.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.quilt_jar.outputs.name }}
          path: ${{ steps.quilt_jar.outputs.path }}
          if-no-files-found: error

      - name: Locate forge jar
        shell: pwsh
        id: forge_jar
        run: |
          if (Test-Path 'forge/build/libs') {
            $jar = Get-ChildItem -Path 'forge/build/libs' -File -Filter '*.jar' |
              Where-Object {
                $_.Name -notlike '*-sources.jar' -and
                $_.Name -notlike '*-javadoc.jar' -and
                $_.Name -notlike '*-dev.jar' -and
                $_.Name -notlike '*-dev-shadow.jar' -and
                $_.Name -notlike '*transformProduction*.jar'
              } |
              Sort-Object Name |
              Select-Object -First 1

            if ($jar) {
              "path=$($jar.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              "name=$($jar.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            }
          }

      - name: Upload forge jar
        if: steps.forge_jar.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.forge_jar.outputs.name }}
          path: ${{ steps.forge_jar.outputs.path }}
          if-no-files-found: error

      - name: Locate neoforge jar
        shell: pwsh
        id: neoforge_jar
        run: |
          if (Test-Path 'neoforge/build/libs') {
            $jar = Get-ChildItem -Path 'neoforge/build/libs' -File -Filter '*.jar' |
              Where-Object {
                $_.Name -notlike '*-sources.jar' -and
                $_.Name -notlike '*-javadoc.jar' -and
                $_.Name -notlike '*-dev.jar' -and
                $_.Name -notlike '*-dev-shadow.jar' -and
                $_.Name -notlike '*transformProduction*.jar'
              } |
              Sort-Object Name |
              Select-Object -First 1

            if ($jar) {
              "path=$($jar.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              "name=$($jar.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            }
          }

      - name: Upload neoforge jar
        if: steps.neoforge_jar.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.neoforge_jar.outputs.name }}
          path: ${{ steps.neoforge_jar.outputs.path }}
          if-no-files-found: error
